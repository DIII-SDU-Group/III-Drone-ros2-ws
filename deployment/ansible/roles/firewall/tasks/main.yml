---
- name: Render the operator-LAN-only nftables policy
  ansible.builtin.template:
    src: nftables.conf.j2
    dest: /etc/nftables.conf
    owner: root
    group: root
    mode: "0644"
    validate: /usr/sbin/nft --check --file %s
  notify: Reload nftables

- name: Enable the host firewall
  ansible.builtin.systemd_service:
    name: nftables.service
    state: started
    enabled: true
  when: not ansible_check_mode

- name: Record firewall ownership without granting receiver network transport
  ansible.builtin.template:
    src: firewall-policy.json.j2
    dest: /etc/iii/firewall-policy.json
    owner: root
    group: "{{ iii_runtime_group_effective }}"
    mode: "0640"
