---
- name: Reload systemd for III control plane
  ansible.builtin.systemd_service:
    daemon_reload: true

- name: Restart systemd-logind
  ansible.builtin.systemd_service:
    name: systemd-logind
    state: restarted
  # The container test target masks logind.
  when: ansible_facts.virtualization_type | default('') not in ['docker', 'container', 'podman']
