---
- name: Create the fixed III runtime group
  ansible.builtin.group:
    name: "{{ iii_runtime_group }}"
    gid: "{{ iii_runtime_gid }}"
    system: true
    state: present

- name: Create the hardware-access supplementary groups
  ansible.builtin.group:
    name: "{{ item }}"
    system: true
    state: present
  loop: "{{ iii_runtime_supplementary_groups }}"

- name: Create the unprivileged III runtime and forced-command SSH user
  ansible.builtin.user:
    name: "{{ iii_runtime_user }}"
    uid: "{{ iii_runtime_uid }}"
    group: "{{ iii_runtime_group_effective }}"
    groups: "{{ omit if ansible_check_mode else (iii_runtime_supplementary_groups | join(',')) }}"
    append: true
    create_home: true
    home: /home/iii
    shell: /bin/bash
    password_lock: true
    system: true
    state: present

- name: Create the III SSH directory
  ansible.builtin.file:
    path: /home/iii/.ssh
    state: directory
    owner: "{{ iii_runtime_owner_effective }}"
    group: "{{ iii_runtime_group_effective }}"
    mode: "0700"

- name: Install final no-sudo policy marker
  ansible.builtin.copy:
    src: "{{ playbook_dir }}/../../host/iii-deployment-final.sudoers"
    dest: /etc/sudoers.d/99-iii-deployment-final
    owner: root
    group: root
    mode: "0440"
    validate: /usr/sbin/visudo -cf %s

- name: Create the dedicated human maintenance group
  ansible.builtin.group:
    name: "{{ iii_maintenance_group }}"
    gid: "{{ iii_maintenance_gid }}"
    system: false
    state: present

- name: Create the key-only human maintenance account
  ansible.builtin.user:
    name: "{{ iii_maintenance_user }}"
    uid: "{{ iii_maintenance_uid }}"
    group: "{{ iii_maintenance_group }}"
    create_home: true
    home: /home/iii-maint
    shell: /bin/bash
    password_lock: true
    system: false
    state: present

- name: Create the maintenance SSH directory
  ansible.builtin.file:
    path: /home/iii-maint/.ssh
    state: directory
    owner: "{{ iii_maintenance_owner_effective }}"
    group: "{{ iii_maintenance_group_effective }}"
    mode: "0700"

- name: Install the independent maintenance SSH public key
  ansible.builtin.copy:
    content: "{{ iii_provisioning_inputs.maintenance_ssh_public_key }}\n"
    dest: /home/iii-maint/.ssh/authorized_keys
    owner: "{{ iii_maintenance_owner_effective }}"
    group: "{{ iii_maintenance_group_effective }}"
    mode: "0600"
  no_log: true

- name: Grant the human maintenance account explicit full sudo
  ansible.builtin.template:
    src: 90-iii-maintenance.sudoers.j2
    dest: /etc/sudoers.d/90-iii-maintenance
    owner: root
    group: root
    mode: "0440"
    validate: /usr/sbin/visudo -cf %s
