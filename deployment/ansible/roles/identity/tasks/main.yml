---
- name: Create the fixed III runtime group
  ansible.builtin.group:
    name: "{{ iii_runtime_group }}"
    gid: "{{ iii_runtime_gid }}"
    system: false
    state: present

- name: Create the hardware-access supplementary groups
  ansible.builtin.group:
    name: "{{ item }}"
    system: true
    state: present
  loop: "{{ iii_runtime_supplementary_groups }}"

- name: Create the III runtime and human field-access user
  ansible.builtin.user:
    name: "{{ iii_runtime_user }}"
    uid: "{{ iii_runtime_uid }}"
    group: "{{ iii_runtime_group_effective }}"
    groups: "{{ omit if ansible_check_mode else (iii_runtime_supplementary_groups | join(',')) }}"
    append: true
    create_home: true
    home: /home/iii
    shell: /bin/bash
    password_lock: true
    system: false
    state: present

- name: Create the human field-access SSH directory
  ansible.builtin.file:
    path: /home/iii/.ssh
    state: directory
    owner: "{{ iii_runtime_owner_effective }}"
    group: "{{ iii_runtime_group_effective }}"
    mode: "0700"

- name: Install final deployment-automation no-sudo policy marker
  ansible.builtin.copy:
    src: "{{ playbook_dir }}/../../host/iii-deployment-final.sudoers"
    dest: /etc/sudoers.d/99-iii-deployment-final
    owner: root
    group: root
    mode: "0440"
    validate: /usr/sbin/visudo -cf %s

- name: Install the independent human field-access SSH public key
  ansible.builtin.copy:
    content: "{{ iii_provisioning_inputs.maintenance_ssh_public_key }}\n"
    dest: /home/iii/.ssh/authorized_keys
    owner: "{{ iii_runtime_owner_effective }}"
    group: "{{ iii_runtime_group_effective }}"
    mode: "0600"
  no_log: true

- name: Grant the III human account explicit full sudo
  ansible.builtin.template:
    src: 90-iii-maintenance.sudoers.j2
    dest: /etc/sudoers.d/90-iii-maintenance
    owner: root
    group: root
    mode: "0440"
    validate: /usr/sbin/visudo -cf %s

- name: Create the dedicated deployment transport group
  ansible.builtin.group:
    name: "{{ iii_deployment_group }}"
    gid: "{{ iii_deployment_gid }}"
    system: false
    state: present

- name: Create the restricted deployment transport account
  ansible.builtin.user:
    name: "{{ iii_deployment_user }}"
    uid: "{{ iii_deployment_uid }}"
    group: "{{ iii_deployment_group }}"
    create_home: true
    home: /home/iii-deploy
    shell: /bin/bash
    password_lock: true
    system: false
    state: present

- name: Create the deployment transport SSH directory
  ansible.builtin.file:
    path: /home/iii-deploy/.ssh
    state: directory
    owner: "{{ iii_deployment_owner_effective }}"
    group: "{{ iii_deployment_group_effective }}"
    mode: "0700"
