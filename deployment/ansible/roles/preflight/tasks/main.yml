---
- name: Validate the fixed hardware class and host operating system
  ansible.builtin.assert:
    that:
      - iii_target_class == 'raspberry-pi-5-noble-arm64'
      - ansible_distribution == iii_expected_distribution
      - ansible_distribution_version is version(iii_expected_release, '==')
      - ansible_distribution_release == iii_expected_codename
      - ansible_architecture == iii_expected_architecture
      - iii_profile in ['real', 'opti_track']
      - iii_logical_target is match('^[a-z][a-z0-9.-]{0,63}$')
    fail_msg: The target does not match the governed Raspberry Pi 5 Noble ARM64 baseline.

- name: Validate provisioning input shape and private operator network
  ansible.builtin.assert:
    that:
      - iii_provisioning_inputs is mapping
      - iii_provisioning_inputs.operator_cidr | iii_private_network
      - iii_provisioning_inputs.receiver_bundle_source is string
      - iii_provisioning_inputs.receiver_wheelhouse_source is string
      - iii_provisioning_inputs.bundle_trust_source is string
      - iii_provisioning_inputs.release_status_trust_source is string
      - iii_provisioning_inputs.receiver_update_trust_source is string
      - iii_provisioning_inputs.operator_public_keys_source is string
      - iii_provisioning_inputs.runtime_api_secret_source is string
    fail_msg: Supply all host inputs through an owner-only Git-ignored extra-vars file.
  no_log: true

- name: Inspect image-provided HTTPS bootstrap trust
  ansible.builtin.stat:
    path: /etc/ssl/certs/ca-certificates.crt
  register: iii_bootstrap_ca_bundle

- name: Require a non-empty image-provided CA bundle before snapshot access
  ansible.builtin.assert:
    that:
      - iii_bootstrap_ca_bundle.stat.exists
      - iii_bootstrap_ca_bundle.stat.isreg
      - iii_bootstrap_ca_bundle.stat.size | int > 0
    fail_msg: The pinned Canonical image is missing HTTPS bootstrap trust; reimage instead of disabling certificate verification.

- name: Inspect required controller-side files
  ansible.builtin.stat:
    path: "{{ item }}"
    get_checksum: true
  loop:
    - "{{ iii_provisioning_inputs.bundle_trust_source }}"
    - "{{ iii_provisioning_inputs.release_status_trust_source }}"
    - "{{ iii_provisioning_inputs.receiver_update_trust_source }}"
    - "{{ iii_provisioning_inputs.operator_public_keys_source }}"
    - "{{ iii_provisioning_inputs.runtime_api_secret_source }}"
  register: iii_controller_files
  delegate_to: localhost
  become: false
  no_log: true

- name: Require real owner-controlled controller files
  ansible.builtin.assert:
    that:
      - item.stat.exists
      - item.stat.isreg
      - not item.stat.islnk
      - (item.stat.mode | int(base=8)) % 64 == 0
    fail_msg: A required controller input is missing, linked, or writable by other users.
  loop: "{{ iii_controller_files.results }}"
  no_log: true

- name: Inspect receiver bundle and wheelhouse sources
  ansible.builtin.stat:
    path: "{{ item }}"
  loop:
    - "{{ iii_provisioning_inputs.receiver_bundle_source }}"
    - "{{ iii_provisioning_inputs.receiver_wheelhouse_source }}"
  register: iii_controller_directories
  delegate_to: localhost
  become: false

- name: Require real controller artifact directories
  ansible.builtin.assert:
    that:
      - item.stat.exists
      - item.stat.isdir
      - not item.stat.islnk
    fail_msg: Receiver bundle and wheelhouse inputs must be real directories.
  loop: "{{ iii_controller_directories.results }}"
