---
- name: Create writable developer runtime paths
  ansible.builtin.file:
    path: "{{ item }}"
    state: directory
    owner: "{{ iii_runtime_owner_effective }}"
    group: "{{ iii_runtime_group_effective }}"
    mode: "0755"
  loop:
    - /home/iii/ws
    - /home/iii/.config/iii_drone
    - /home/iii/.ros/log
    - /var/log/iii
    - /run/iii

- name: Recreate the writable runtime directory at boot
  ansible.builtin.copy:
    dest: /etc/tmpfiles.d/iii.conf
    owner: root
    group: root
    mode: "0644"
    content: |
      d /run/iii 0755 iii iii -

- name: Remove immutable release and receiver directories
  ansible.builtin.file:
    path: "{{ item }}"
    state: absent
  loop:
    - /opt/iii
    - /var/lib/iii/deployment
    - /var/lib/iii/incoming
    - /etc/iii/trust
    - /etc/iii/secrets

- name: Keep ordinary III logs bounded for development
  ansible.builtin.copy:
    dest: /etc/logrotate.d/iii
    owner: root
    group: root
    mode: "0644"
    content: |
      /var/log/iii/*.log /home/iii/.ros/log/*.log {
          weekly
          rotate 4
          missingok
          notifempty
          compress
          copytruncate
      }
