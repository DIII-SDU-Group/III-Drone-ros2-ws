---
- name: Create governed host filesystem directories
  ansible.builtin.file:
    path: "{{ item.path }}"
    state: directory
    owner: "{{ iii_runtime_owner_effective if item.owner == 'iii' else item.owner }}"
    group: "{{ iii_runtime_group_effective if item.group == 'iii' else item.group }}"
    mode: "{{ item.mode }}"
  loop: "{{ iii_filesystem_directories }}"

- name: Recreate transient runtime directory at boot
  ansible.builtin.copy:
    dest: /etc/tmpfiles.d/iii.conf
    owner: root
    group: root
    mode: "0644"
    content: |
      d /run/iii 0750 iii iii -
      d /run/iii/clock-flush 0750 iii iii -

- name: Bound III file log retention
  ansible.builtin.copy:
    dest: /etc/logrotate.d/iii
    owner: root
    group: root
    mode: "0644"
    content: |
      /var/log/iii/*.log /var/log/iii/*/*.log /var/log/iii/deployment/*.jsonl {
          daily
          rotate 14
          size 100M
          missingok
          notifempty
          compress
          delaycompress
          copytruncate
      }
