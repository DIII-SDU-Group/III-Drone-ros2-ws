---
- name: Verify the data-driven hardware package baseline is installed
  ansible.builtin.apt:
    name: "{{ iii_hardware_packages }}"
    state: present
    install_recommends: false
    update_cache: false
  environment:
    DEBIAN_FRONTEND: noninteractive

- name: Install the shared hardware-role manifest
  ansible.builtin.copy:
    src: "{{ playbook_dir }}/../../hardware/shared-hardware-role-manifest.json"
    dest: /etc/iii/hardware-role-manifest.json
    owner: root
    group: "{{ iii_runtime_group_effective }}"
    mode: "0640"

- name: Install the generated shared hardware-role udev rules
  ansible.builtin.copy:
    src: "{{ playbook_dir }}/../../hardware/90-iii-hardware-roles.rules"
    dest: /etc/udev/rules.d/90-iii-hardware-roles.rules
    owner: root
    group: root
    mode: "0644"
  notify: Reconcile III hardware udev

- name: Record the hardware-class baseline boundary
  ansible.builtin.template:
    src: hardware-baseline.json.j2
    dest: /etc/iii/hardware-baseline.json
    owner: root
    group: "{{ iii_runtime_group_effective }}"
    mode: "0640"
