---
- name: Converge the III target-equivalent Noble host baseline
  hosts: all
  become: true
  gather_facts: true
  vars_files:
    - ../vars/raspberry-pi-5-noble-arm64.yml
    - ../vars/target-equivalent-amd64-test.yml
  roles:
    - role: preflight
      tags: [always]
    - role: identity
      tags: [identity]
    - role: filesystem
      tags: [filesystem]
    - role: apt_baseline
      tags: [packages]
    - role: hardware_baseline
      tags: [hardware]
    - role: boot_baseline
      tags: [boot]
    - role: time
      tags: [time]
    - role: network_baseline
      tags: [network]
    - role: runtime_control_plane
      tags: [runtime]
    - role: host_health
      tags: [health]
