name: III Repository Governance

on:
  pull_request:
    branches: [develop, main]

permissions:
  contents: read

jobs:
  promotion-source:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Checkout candidate repository
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
        with:
          fetch-depth: 0
      - name: Checkout trusted workspace policy
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
        with:
          repository: DIII-SDU-Group/III-Drone-ros2-ws
          ref: develop
          path: .iii-governance
          fetch-depth: 1
      - name: Validate feature/develop/main source
        run: |
          PYTHONPATH=.iii-governance/deployment/src python .iii-governance/scripts/ci/verify_submodule_pr.py \
            --repository-root "$GITHUB_WORKSPACE" \
            --base "${{ github.base_ref }}" \
            --head "${{ github.head_ref }}" \
            --head-sha "${{ github.event.pull_request.head.sha }}"

  promotion-source-target:
    name: promotion-source-${{ github.base_ref }}
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Checkout candidate repository
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
        with:
          fetch-depth: 0
      - name: Checkout trusted workspace policy
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
        with:
          repository: DIII-SDU-Group/III-Drone-ros2-ws
          ref: develop
          path: .iii-governance
          fetch-depth: 1
      - name: Validate target-specific feature/develop/main source
        run: |
          PYTHONPATH=.iii-governance/deployment/src python .iii-governance/scripts/ci/verify_submodule_pr.py \
            --repository-root "$GITHUB_WORKSPACE" \
            --base "${{ github.base_ref }}" \
            --head "${{ github.head_ref }}" \
            --head-sha "${{ github.event.pull_request.head.sha }}"

  iii-package-check:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Checkout candidate repository
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
      - name: Checkout trusted workspace policy
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
        with:
          repository: DIII-SDU-Group/III-Drone-ros2-ws
          ref: develop
          path: .iii-governance
          fetch-depth: 1
      - name: Run trusted editable-repository baseline
        run: python .iii-governance/scripts/ci/check_editable_iii_repository.py --repository-root "$GITHUB_WORKSPACE"
