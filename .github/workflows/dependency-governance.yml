name: Dependency Governance

on:
  pull_request:
  push:
    branches:
      - main
      - develop
      - release

concurrency:
  group: dependency-governance-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: false

permissions: {}

jobs:
  promotion-source:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: read
      pull-requests: read
    steps:
      - name: Checkout exact PR head
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
        with:
          persist-credentials: false
          fetch-depth: 0
          submodules: recursive
      - name: Validate source and mechanical diff
        run: |
          PYTHONPATH=deployment/src python scripts/ci/verify_promotion_source.py \
            --phase source \
            --base "${{ github.base_ref }}" \
            --head "${{ github.head_ref }}" \
            --base-sha "${{ github.event.pull_request.base.sha }}" \
            --head-sha "${{ github.event.pull_request.head.sha }}" \
            --json

  promotion-source-target:
    name: promotion-source-${{ github.base_ref }}
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: read
      pull-requests: read
    steps:
      - name: Checkout exact PR head
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
        with:
          persist-credentials: false
          fetch-depth: 0
          submodules: recursive
      - name: Validate target-specific source and mechanical diff
        run: |
          PYTHONPATH=deployment/src python scripts/ci/verify_promotion_source.py \
            --phase source \
            --base "${{ github.base_ref }}" \
            --head "${{ github.head_ref }}" \
            --base-sha "${{ github.event.pull_request.base.sha }}" \
            --head-sha "${{ github.event.pull_request.head.sha }}" \
            --json

  promotion-evidence:
    if: github.event_name == 'pull_request' && contains(fromJSON('["main","release"]'), github.base_ref)
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: read
      pull-requests: read
    steps:
      - name: Checkout exact PR head
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
        with:
          persist-credentials: false
          fetch-depth: 0
          submodules: recursive
      - name: Fetch untrusted signed promotion evidence transport
        uses: actions/github-script@ed597411d8f924073f98dfc5c65a23a2325f34cd
        with:
          script: |
            const fs = require('fs');
            const comments = await github.paginate(github.rest.issues.listComments, {
              owner: context.repo.owner, repo: context.repo.repo,
              issue_number: context.issue.number, per_page: 100
            });
            const marker = '<!-- iii-promotion-evidence-v1 -->';
            const candidates = comments.filter(c => c.body && c.body.includes(marker));
            if (candidates.length !== 1) core.setFailed(`Expected exactly one promotion evidence comment; found ${candidates.length}`);
            const fenced = candidates[0].body.match(/```json\s*([\s\S]*?)```/);
            if (!fenced) core.setFailed('Promotion evidence comment has no JSON block');
            fs.mkdirSync('.ci', {recursive: true});
            fs.writeFileSync('.ci/promotion-attestation.json', fenced[1]);
            fs.writeFileSync('.ci/trusted-promotion-signers.json', process.env.TRUSTED_SIGNERS || '{"signers":{}}');
        env:
          TRUSTED_SIGNERS: ${{ vars.III_PROMOTION_SIGNERS_JSON }}
      - name: Validate source, mechanical diff, impact, and signature
        run: |
          PYTHONPATH=deployment/src python scripts/ci/verify_promotion_source.py \
            --phase evidence \
            --base "${{ github.base_ref }}" \
            --head "${{ github.head_ref }}" \
            --base-sha "${{ github.event.pull_request.base.sha }}" \
            --head-sha "${{ github.event.pull_request.head.sha }}" \
            --attestation .ci/promotion-attestation.json \
            --trusted-signers .ci/trusted-promotion-signers.json \
            --json

  deployment-contracts:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
        with:
          persist-credentials: false
          submodules: recursive
      - name: Install pinned deployment contract dependencies
        run: python -m pip install --disable-pip-version-check ./deployment[test]
      - name: Validate deployment contracts and traceability
        run: python -m pytest deployment/tests

  verify-submodule-lock:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: read

    steps:
      - name: Checkout
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
        with:
          persist-credentials: false
          submodules: recursive

      - name: Verify submodule lock
        run: ./scripts/git/verify_submodule_lock.sh

  verify-iii-branch-policy:
    if: github.event_name == 'pull_request' && github.base_ref != 'release'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: read

    steps:
      - name: Checkout
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
        with:
          persist-credentials: false
          fetch-depth: 0
          submodules: recursive

      - name: Verify III submodule branch policy (base->feature stack)
        run: |
          ./scripts/ci/verify_iii_submodule_branch_policy_ci.sh \
            --base "${{ github.base_ref }}" \
            --feature "${{ github.head_ref }}"

  verify-iii-submodules-on-target-branch:
    if: github.event_name == 'pull_request' && contains(fromJSON('["develop","main","release"]'), github.base_ref)
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: read

    steps:
      - name: Checkout
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
        with:
          persist-credentials: false
          fetch-depth: 0
          submodules: recursive

      - name: Verify III submodule pointers equal origin/${{ github.base_ref }} HEAD
        run: |
          target="${{ github.base_ref }}"
          [[ "$target" == "release" ]] && target=main
          ./scripts/ci/verify_iii_submodule_commits_on_branch_ci.sh --target-branch "$target"

      - name: Upload III submodule status artifact
        if: always()
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f
        with:
          name: iii-submodule-status
          path: .ci/iii-submodule-status.tsv
          if-no-files-found: ignore
          overwrite: false
          retention-days: 14

  comment-iii-submodule-status:
    if: always() && github.event_name == 'pull_request' && contains(fromJSON('["develop","main","release"]'), github.base_ref)
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      actions: read
      contents: read
      pull-requests: write
    needs:
      - verify-iii-submodules-on-target-branch
    steps:
      - name: Download III submodule status artifact
        continue-on-error: true
        uses: actions/download-artifact@37930b1c2abaa49bbe596cd826c3c89aef350131
        with:
          name: iii-submodule-status
          path: .ci

      - name: Upsert PR status comment
        uses: actions/github-script@ed597411d8f924073f98dfc5c65a23a2325f34cd
        with:
          script: |
            const fs = require('fs');
            const marker = '<!-- iii-submodule-status-bot -->';
            const path = '.ci/iii-submodule-status.tsv';
            let lines = [];
            if (fs.existsSync(path)) {
              lines = fs.readFileSync(path, 'utf8')
                .split('\n')
                .filter(Boolean);
            }

            const rows = [];
            let mismatches = 0;
            for (const line of lines) {
              const [submodule, sha, status, detail] = line.split('\t');
              const shortSha = (sha || '').slice(0, 8);
              if (status === 'MISMATCH') mismatches++;
              rows.push(`| \`${submodule}\` | \`${shortSha}\` | ${status} | ${detail} |`);
            }

            const state = mismatches === 0 ? 'PASS' : 'FAIL';
            const targetBranch = context.payload.pull_request.base.ref;
            const header = `${marker}\n### III Submodule Target Branch Gate (${targetBranch}): ${state}\n`;
            const summary = mismatches === 0
              ? `All pinned III submodule commits exactly match \`origin/${targetBranch}\` HEAD.`
              : `${mismatches} submodule(s) do not match \`origin/${targetBranch}\` HEAD.`;

            const table = rows.length
              ? [
                  '',
                  '| Submodule | Pinned SHA | Status | Detail |',
                  '|---|---:|---|---|',
                  ...rows
                ].join('\n')
              : '\n_No status artifact found._';

            const body = `${header}\n${summary}\n${table}\n`;

            const { owner, repo } = context.repo;
            const issue_number = context.issue.number;

            const comments = await github.paginate(github.rest.issues.listComments, {
              owner,
              repo,
              issue_number,
              per_page: 100
            });

            const existing = comments.find(c => c.body && c.body.includes(marker));
            if (existing) {
              await github.rest.issues.updateComment({
                owner,
                repo,
                comment_id: existing.id,
                body
              });
            } else {
              await github.rest.issues.createComment({
                owner,
                repo,
                issue_number,
                body
              });
            }

  verify-linked-submodule-prs-merged:
    if: github.event_name == 'pull_request' && contains(fromJSON('["develop","main","release"]'), github.base_ref)
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: read
      pull-requests: read
    steps:
      - name: Checkout trusted base policy only
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
        with:
          ref: ${{ github.event.pull_request.base.sha }}
          fetch-depth: 1
          submodules: false
          persist-credentials: false
      - name: Verify untrusted PR locators against trusted gitlinks and API state
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: python scripts/ci/verify_linked_submodule_prs.py --json
