name: Dependency Integrity

on:
  pull_request:
  push:
    branches:
      - main
      - develop
      - release

concurrency:
  group: dependency-integrity-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: false

permissions: {}

jobs:
  verify-submodule-lock:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
        with:
          persist-credentials: false
          submodules: recursive
      - name: Verify declared submodule revisions
        run: ./scripts/git/verify_submodule_lock.sh

  verify-submodule-lock-tests:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
        with:
          persist-credentials: false
          submodules: false
      - name: Verify lock and workflow regression tests
        run: python -m pytest -q tests/integration/test_submodule_lock_scripts.py tests/integration/test_developer_ci_workflow.py

  verify-iii-branch-policy:
    if: github.event_name == 'pull_request' && github.base_ref != 'release'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
        with:
          persist-credentials: false
          fetch-depth: 0
          submodules: recursive
      - name: Verify III submodule feature branches match the workspace branch
        run: |
          ./scripts/ci/verify_iii_submodule_branch_policy_ci.sh \
            --base "${{ github.base_ref }}" \
            --feature "${{ github.head_ref }}"
